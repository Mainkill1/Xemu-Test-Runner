name: authoring-buildkit
on:
  pull_request:
    paths: ['.github/workflows/authoring-buildkit.yml']
permissions:
  contents: read
jobs:
  native-validation-dependencies:
    runs-on: ubuntu-latest
    steps:
      - name: Install public native test dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends gstreamer1.0-nice libxcb-xtest0 libxcb-xtest0-dev
      - name: Package native test dependencies only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p native/lib native/plugins native/include
          cp -L /usr/lib/x86_64-linux-gnu/libxcb-xtest.so.0 native/lib/
          cp -L /usr/lib/x86_64-linux-gnu/gstreamer-1.0/libgstnice.so native/plugins/
          cp /usr/include/xcb/xtest.h native/include/
          tar -C native -czf authoring-native-dependencies.tar.gz .
      - uses: actions/upload-artifact@v7
        with:
          name: authoring-native-dependencies
          path: authoring-native-dependencies.tar.gz
          retention-days: 1
