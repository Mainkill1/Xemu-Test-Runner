name: state-qualification
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  state-checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Check run-state isolation and provenance
        run: dotnet run --project tests/StateChecks -c Release
