name: crash-qualification
on:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/CrashChecks/**'
      - 'tools/runner_posix.py'
      - '.github/workflows/crash-qualification.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  crash-checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Record exact qualification source
        shell: bash
        run: |
          mkdir -p crash-evidence
          git rev-parse HEAD > crash-evidence/commit.txt
          git archive --format=zip HEAD --output=crash-evidence/source.zip
      - name: Test native crash and queue continuation
        shell: pwsh
        env:
          CRASH_CHECK_EVIDENCE: ${{ github.workspace }}/crash-evidence/runs
        run: |
          dotnet run --project tests/CrashChecks -c Release 2>&1 | Tee-Object crash-evidence/checks.log
          exit $LASTEXITCODE
      - name: Retain diagnostic proof and source identity
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: crash-qualification-${{ matrix.os }}
          path: crash-evidence
          retention-days: 7
          if-no-files-found: error
