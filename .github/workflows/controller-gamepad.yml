name: controller-gamepad
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  os-input:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: x64
            arch: x64
            workerArch: x64
          - os: windows-11-arm
            python: x64
            arch: x64
            workerArch: ARM64
          - os: windows-11-arm
            python: arm64
            arch: ARM64
            workerArch: ARM64
    runs-on: ${{ matrix.os }}
    env:
      SDL_JOYSTICK_RAWINPUT: '0'
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          architecture: ${{ matrix.python }}
      - name: Verify checkout and observer scheduling regression
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          python tests/gamepad/check_observer_isolation.py
      - name: Provision built-in Linux input on isolated CI host
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libsdl2-2.0-0 libudev-dev
          sudo modprobe uinput
          sudo chown "$(id -u):$(id -g)" /dev/uinput
          sudo chmod 0600 /dev/uinput
          echo "SUBSYSTEM==\"input\", KERNEL==\"event*\", ATTRS{name}==\"Xemu Runner Gamepad\", OWNER=\"$(id -u)\", MODE=\"0600\"" | sudo tee /etc/udev/rules.d/90-xtr-gamepad-ci.rules
          sudo udevadm control --reload-rules
      - name: Fetch pinned SDL2 observer runtime (no driver)
        if: runner.os == 'Windows' && matrix.arch == 'x64'
        shell: pwsh
        run: |
          Invoke-WebRequest 'https://github.com/libsdl-org/SDL/releases/download/release-2.32.10/SDL2-2.32.10-win32-x64.zip' -OutFile sdl.zip
          if ((Get-FileHash sdl.zip -Algorithm SHA256).Hash.ToLower() -ne '6cf9706eefd0a4a06dc764007934d428afaf029fabdd408a9e646048c91e18fb') { throw 'SDL checksum mismatch' }
          Expand-Archive sdl.zip -DestinationPath sdl
          "SDL2_LIBRARY=$((Get-ChildItem sdl -Recurse -Filter SDL2.dll | Select-Object -First 1).FullName)" >> $env:GITHUB_ENV
      - name: Record Windows context
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          whoami /groups
          Get-CimInstance Win32_OperatingSystem | Select-Object Caption, Version, OSArchitecture
      - name: Configure Linux user-mode adapter
        if: runner.os == 'Linux'
        run: cmake -S native/gamepad -B gamepad-build -DCMAKE_BUILD_TYPE=Release
      - name: Configure native Windows user-mode adapter
        if: runner.os == 'Windows'
        run: cmake -S native/gamepad -B gamepad-build -A ${{ matrix.workerArch }}
      - id: native-build
        run: cmake --build gamepad-build --config Release --parallel 4
      - run: ctest --test-dir gamepad-build -C Release --output-on-failure
      - name: Independent XInput readback
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          python tests/gamepad/check_xinput.py gamepad-build/Release/xemu-gamepad.exe 2>&1 | tee gamepad-xinput-qualification.log
      - name: SDL2 input and cleanup qualification
        if: always() && steps.native-build.outcome == 'success' && matrix.arch == 'x64'
        shell: bash
        run: |
          set -euo pipefail
          exe=gamepad-build/xemu-gamepad
          if [ "$RUNNER_OS" = Windows ]; then exe=gamepad-build/Release/xemu-gamepad.exe; fi
          python tests/gamepad/qualify_isolated.py sdl2 "$exe" 2>&1 | tee gamepad-qualification.log
      - uses: actions/checkout@v7
        if: always() && steps.native-build.outcome == 'success'
        with:
          repository: libsdl-org/SDL
          ref: 877399b2b2cf21e67554ed9046410f268ce1d1b2
          path: .ci-sdl3
          persist-credentials: false
      - name: Build pinned SDL3 input observer library
        id: sdl3-build
        if: always() && steps.native-build.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          arch=(-DSDL_UNIX_CONSOLE_BUILD=ON)
          if [ "$RUNNER_OS" = Windows ]; then arch=(-A "${{ matrix.arch }}"); fi
          cmake -S .ci-sdl3 -B sdl3-build "${arch[@]}" -DCMAKE_BUILD_TYPE=Release -DSDL_SHARED=ON -DSDL_STATIC=OFF -DSDL_TESTS=OFF -DSDL_TEST_LIBRARY=OFF -DSDL_EXAMPLES=OFF -DSDL_AUDIO=OFF -DSDL_VIDEO=OFF -DSDL_RENDER=OFF -DSDL_GPU=OFF -DSDL_CAMERA=OFF
          cmake --build sdl3-build --config Release --parallel 4
          python -c "from pathlib import Path; import os; p=next(Path('sdl3-build').rglob('SDL3.dll' if os.name=='nt' else 'libSDL3.so.0')); open(os.environ['GITHUB_ENV'],'a').write('SDL3_LIBRARY='+str(p.resolve())+'\n')"
      - name: SDL3 input and cleanup qualification
        if: always() && steps.sdl3-build.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          exe=gamepad-build/xemu-gamepad
          if [ "$RUNNER_OS" = Windows ]; then exe=gamepad-build/Release/xemu-gamepad.exe; fi
          python tests/gamepad/qualify_isolated.py sdl3 "$exe" 2>&1 | tee gamepad-sdl3-qualification.log
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: os-gamepad-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            gamepad-qualification.log
            gamepad-sdl3-qualification.log
            gamepad-xinput-qualification.log
            gamepad-xinput-results.json
            gamepad-results.json
            gamepad-sdl3-results.json
            gamepad-build/Release/xemu-gamepad.exe
            gamepad-build/xemu-gamepad
            gamepad-build/linux-sdl-mapping.txt
          if-no-files-found: warn
      - name: Archive exact tested source
        if: always() && runner.os == 'Linux'
        run: git archive --format=tar.gz -o runner-source.tar.gz HEAD
      - uses: actions/upload-artifact@v7
        if: always() && runner.os == 'Linux'
        with:
          name: runner-source-${{ github.event.pull_request.head.sha || github.sha }}
          path: runner-source.tar.gz
          if-no-files-found: error

  windows-server-capability:
    name: Server capability refusal (not controller qualification)
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: cmake -S native/gamepad -B gamepad-build -A x64
      - run: cmake --build gamepad-build --config Release --parallel 4
      - run: ctest --test-dir gamepad-build -C Release --output-on-failure
      - run: python tests/gamepad/check_unavailable.py gamepad-build/Release/xemu-gamepad.exe
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: gamepad-server-capability
          path: gamepad-unavailable.json
          if-no-files-found: warn

  managed-provider:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Verify actual managed provider using isolated pipe fixtures
        run: dotnet run --project tests/GamepadProviderChecks -c Release
      - name: Verify controller execution integration when present
        if: hashFiles('tests/ControllerIntegrationChecks/*.csproj') != ''
        run: dotnet run --project tests/ControllerIntegrationChecks -c Release
