name: finalization-qualification
on:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/FinalizationChecks/**'
      - 'tools/runner_posix.py'
      - '.github/workflows/finalization-qualification.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  finalization-checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Check success and failure capture with real child processes
        run: dotnet run --project tests/FinalizationChecks -c Release
