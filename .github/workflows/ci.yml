name: build-and-test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runner-checks:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
            label: Linux
          - os: windows-latest
            rid: win-x64
            label: Windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/*.csproj'
      - name: Build without warnings
        run: dotnet build tests/RunnerChecks/RunnerChecks.csproj -c Release --nologo
      - name: Run regression and process integration checks
        run: dotnet run --project tests/RunnerChecks -c Release --no-build
      - name: Run agent HTTP contract checks
        run: dotnet run --project tests/AgentChecks -c Release
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Run HTTP client contract checks
        run: python -m unittest discover -s tests -p test_runner_api.py -v
      - name: Run client against the actual embedded HTTP listener
        run: dotnet run --project tests/AgentChecks -c Release --no-build -- --client
      - name: Publish Linux
        if: runner.os == 'Linux'
        run: bash scripts/publish.sh linux-x64
      - name: Publish Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/publish.ps1 -Rid win-x64
      - uses: actions/upload-artifact@v7
        with:
          name: xemu-test-runner-${{ matrix.label }}-x64
          path: publish/${{ matrix.rid }}
          if-no-files-found: error

  browser-fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install browser fixture dependencies
        run: |
          python -m pip install --disable-pip-version-check playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Run browser fixtures
        run: python scripts/check-browser.py
      - name: Check diagnostic helpers
        run: python -m py_compile tools/renderdoc_analyze.py tools/renderdoc_session.py
