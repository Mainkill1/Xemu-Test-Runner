name: XISO campaign qualification
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  campaign-checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: XISO HTTP and disk contracts
        run: dotnet run --project tests/XisoChecks -c Release
      - name: XISO client contracts
        run: python -m unittest discover -s tests -p 'test_runner_xiso*.py' -v
